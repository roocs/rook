name: rook-dev
channels:
  - conda-forge
dependencies:
  # Updated CA bundles for the eMudhra / emSign incident.
  - ca-certificates >=2026.10.23
  - certifi >=2026.10.23
  - python >=3.11,<3.15
  - pip >=26.2.2
  - virtualenv >=21.14.12
  # development
  - bump-my-version >=0.26.0
  - coverage >=7.5.0
  - cruft >=2.15.0
  - flit >=3.9.0,<4.0
  - nbsphinx >=0.9.5
  - nbval >=0.10.0
  - ruff >=0.5.7
  - sphinx >=7.0.0
  - sphinxcontrib-mermaid
  - tox >=4.18.0
  - watchdog >=4.0.0
  # tests
  - pytest >=8.0.0
  - pytest-cov >=5.0.0
  - pytest-timeout >=2.3.1
