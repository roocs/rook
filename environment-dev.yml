name: rook-dev
channels:
  - conda-forge
dependencies:
  - python >=3.9,<3.15
  # development
  - bump-my-version >=1.5.1
  - coverage >=7.5.0
  - cruft >=2.15.0
  - flit >=4.0,<5.0
  - nbsphinx >=0.9.5
  - nbval >=0.10.0
  - prek >=0.5.0
  - ruff >=0.5.7
  - sphinx >=7.0.0
  - sphinxcontrib-mermaid
  - tox >=4.18.0
  - watchdog >=4.0.0
  # tests
  - pytest >=9.0.2
  - pytest-cov >=7.1.0
  - pytest-timeout >=2.4.0
  - pytest-xdist >=3.2
