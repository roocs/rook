[catalog]
intake_catalog_url = https://raw.githubusercontent.com/cp4cds/c3s_34g_manifests/master/intake/catalogs/c3s.yaml

[fixes]
backend = woodpecker

[subset:batching]
# Independent time-axis and process-memory targets. The stricter target wins.
target_timesteps = 2000
# Keep this aligned with the Slurm job memory configured by deployment tooling.
# Half is reserved for Xarray/Dask/NetCDF writer overhead.
memory_limit = 4GB
min_batch_years = 1
max_batch_years = 10
# Estimate merge groups from the first temporary batch's on-disk size. The
# planning target is capped by clisops:write.file_size_limit.
merge_outputs = true
merge_target_size = 2GB

[concat:batching]
# Memory estimates include the combined payload across all ensemble members.
# Concat uses subannual batches when the effective target is below one year.
target_timesteps = 365
memory_limit = 4GB
min_batch_years = 1
max_batch_years = 1
# Join consecutive decadal batches up to the clisops output limit.
merge_outputs = true
merge_target_size = 2GB

[health]
# Comma-separated project names whose base_dir/.health-check.txt sentinel must
# be readable. For example, the first entry below uses the base_dir configured
