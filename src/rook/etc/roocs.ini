[subset:batching]
target_timesteps = 2000
# Approximate process-memory ceiling. The planner reserves half for decoded
# temporal data and half for Xarray/Dask/NetCDF writer overhead.
memory_limit = 4GB
min_batch_years = 1
max_batch_years = 10
# Estimate merge groups from the first temporary batch's on-disk size. The
# planning target is capped by clisops:write.file_size_limit.
merge_outputs = true
merge_target_size = 200MB

[concat:batching]
target_timesteps = 365
# Applied to the combined payload across all realizations. Concat falls back to
# coordinate-aligned subannual batches when the effective target is below a year.
memory_limit = 4GB
min_batch_years = 1
max_batch_years = 1

[diagnostics]
# Run Python GC and ask glibc to release unused heap memory after each concat batch.
free_memory = false

[catalog]
intake_catalog_url = https://raw.githubusercontent.com/cp4cds/c3s_34g_manifests/master/intake/catalogs/c3s.yaml

[fixes]
backend = woodpecker

[health]
# Comma-separated project names whose base_dir/.health-check.txt sentinel must
# be readable, for example: c3s-cordex, c3s-cmip6, c3s-cica-atlas
# projects = c3s-cordex

[s3]
# Example:
# These options are shared by NetCDF files and Zarr stores on S3.
# Zarr stores are detected from paths ending in .zarr; no [zarr] section is needed.
# base_dir = s3://example-bucket/data
# anon = true
# endpoint_url = https://s3.example.org
# key = ${S3_ACCESS_KEY_ID}
# secret = ${S3_SECRET_ACCESS_KEY}
# token = ${S3_SESSION_TOKEN}
# storage_options_json = {"anon": true}
# client_kwargs_json = {"endpoint_url": "https://s3.example.org"}

# Optional per-project override:
# [project:c3s-cmip6]
# Catalog paths below this prefix may point to either NetCDF files or .zarr stores.
# s3_base_dir = s3://example-bucket/cmip6
