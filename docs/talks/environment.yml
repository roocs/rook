# Slide toolchain: usable independently of the Rook service dependencies.
# From docs/talks: make install
# DeckTape is installed with npm afterwards; see README.md.
name: rook
channels:
  - conda-forge
dependencies:
  # Updated CA bundles for the eMudhra / emSign incident.
  - ca-certificates >=2026.10.23
  - certifi >=2026.10.23
  - python >=3.11
  - pip >=26.2.2
  - quarto >=1.6,<2
  # Includes npm/npx; use Node 22 LTS for DeckTape and Puppeteer.
  - nodejs >=22,<23
