[build-system]
requires = ["flit_core >=4.0,<5.0"]
build-backend = "flit_core.buildapi"

[project]
name = "birdhouse-rook"
authors = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"}
]
maintainers = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"},
  {name = "Trevor James Smith", email = "smith.trevorj@ouranos.ca"}
]
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11.0"
keywords = ["wps", "pywps", "birdhouse", "rook"]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dynamic = ["description", "version"]
dependencies = [
  "aiohttp",
  "beautifulsoup4 >4.12.3",
  "bokeh >=3.7.0",
  "click >=8.1.7",
  "clisops >=0.17.0",
  "fsspec",
  "h5netcdf >=1.5.0",
  "h5py",
  "humanize",
  "intake <2.0",
  "jinja2 >=3.1.4",
  "networkx",
  "pandas >=2.0",
  "prov >=2.0.0",
  "psutil >=6.0.0",
  "pydot",
  "pywps >=4.5.2,<4.8",
  "rdflib",
  "roocs_grids >=0.1.2",
  "roocs-woodpecker >=0.7.1,<0.8",
  "roocs-woodpecker-atlas-plugin >=0.7.1,<0.8",
  "roocs-woodpecker-cmip6-decadal-plugin >=0.7.1,<0.8",
  "s3fs",
  "SQLAlchemy >=2.0",
  "xarray >=2025.6.0",
  "xesmf >=0.9.2",
  "zarr >=2.13.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pip >=24.2.0",
  "black >=24.10.0",
  "bump-my-version >=0.26.0",
  "coverage >=7.5.0",
  "cruft >=2.15.0",
  "flit >=3.9.0,<4.0",
  "flit_core >=3.9,<4",
  "ipython>=8.13.0",
  "nbconvert >=7.10.0",
  "nbsphinx >=0.9.5",
  "nbval >=0.10.0",
  "prek",
  "pytest >=8.0.0",
  "pytest-cov >=5.0.0",
  "pytest-xdist[psutil] >=3.2",
  "ruff >=0.5.7",
  "sphinx >=7.0.0",
  "sphinxcontrib-mermaid",
  "tox >=4.18.0",
  "watchdog >=4.0.0",
  "wheel >=0.40.0"
]
docs = [
  "ipython >=8.13.0",
  "nbsphinx >=0.9.5",
  "sphinx >=7.0.0",
  "sphinx-codeautolink",
  "sphinx-copybutton",
  "sphinxcontrib-mermaid"
]

[project.scripts]
rook = "rook.cli:cli"

[project.urls]
"Issue tracker" = "https://github.com/roocs/rook/issues"
"Changelog" = "https://github.com/roocs/rook/blob/main/changelog.rst"
"Homepage" = "https://github.com/roocs/rook"

[dependency-groups]
lint = [
  # Linting tools
  "codespell >=2.4.2",
  "deptry >=0.25.1",
  "flake8 >=7.3.0",
  "flake8-rst-docstrings >=0.4.0",
  "mypy >=1.20.0",
  "numpydoc >=1.10.0",
  "ruff >=0.15.0",
  "vulture >=2.14",
  "yamllint >=1.38.0"
]
docs = [
  # Documentation and example support
  "alabaster >=1.0.0",
  "ipykernel",
  "ipython >=8.10.0",
  "jupyter_client",
  "nbsphinx >=0.9.8",
  "sphinx >=9.0.2",
  "sphinx-autobuild >=2024.4.16",
  "sphinx-click",
  "sphinx-codeautolink >=0.16.2",
  "sphinx-copybutton >=0.5.2"
]
test = [
  "coverage >=7.5.0",
  "nbval >=0.11.0",
  "pytest >=9.0.0",
  "pytest-cov >=7.1.0"
]
tox = [
  "tox >=4.52.0",
  "tox-gh >=1.7.1"
]
dev = [
  # Development and testing tools
  "bump-my-version >=1.5.1",
  "cruft >=2.16.0",
  "flit >=4.0,<5.0",
  "pip >=26.1",
  "prek >=0.5.0",
  "watchdog >=6.0.0",
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "test"},
  {include-group = "tox"}
]

[tool]

[tool.black]
target-version = [
  "py311",
  "py312"
]

[tool.bumpversion]
current_version = "1.4.0"
commit = true
commit_args = "--no-verify"
tag = false
tag_name = "v{new_version}"
allow_dirty = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\-(?P<release>[a-z]+)(\\.(?P<build>\\d+)))?"
serialize = [
  "{major}.{minor}.{patch}-{release}.{build}",
  "{major}.{minor}.{patch}"
]

[[tool.bumpversion.files]]
filename = "CHANGELOG.rst"
search = """\
Unreleased
==========
"""
replace = """\
Unreleased
==========

{new_version} ({now:%Y-%m-%d})
==================
"""

[[tool.bumpversion.files]]
filename = "CITATION.cff"
include_bumps = ["release"]
search = "^version: \"[0-9]+\\.[0-9]+\\.[0-9]\""
replace = "version: \"{new_version}\""
regex = true

[[tool.bumpversion.files]]
filename = "Dockerfile"
search = "LABEL org.opencontainers.image.version=\"{current_version}\""
replace = "LABEL org.opencontainers.image.version=\"{new_version}\""

[[tool.bumpversion.files]]
filename = 'Dockerfile'
search = "LABEL org.opencontainers.image.created=\"\\d4-\\d2-\\d2T\\d2:\\d2:\\d2Z\""
replace = "LABEL org.opencontainers.image.created=\"{utcnow:%Y-%m-%dT%H:%M:%SZ}\""
regex = true

[[tool.bumpversion.files]]
filename = "src/rook/__version__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Dockerfile"
search = "Version=\"{current_version}\""
replace = "Version=\"{new_version}\""

[[tool.bumpversion.files]]
filename = ".cruft.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[tool.bumpversion.parts.build]
independent = false

[tool.bumpversion.parts.release]
optional_value = "release"
values = [
  "dev",
  "release"
]

[tool.codespell]
ignore-words-list = "astroid,thirdparty"

[tool.coverage.paths]
source = ["src/rook/", "*/site-packages/rook/"]

[tool.coverage.run]
omit = ["tests/*.py"]
relative_files = true
source = ["rook"]

[tool.flit.module]
name = "rook"

[tool.flit.sdist]
include = [
  ".zenodo.json",
  "AUTHORS.rst",
  "CHANGELOG.rst",
  "CONTRIBUTING.rst",
  "LICENSE",
  "Makefile",
  "README.rst",
  "linux-64.spec",
  "environment.yml",
  "environment-dev.yml",
  "environment-docs.yml",
  "docs/_static/_images/*.gif",
  "docs/_static/_images/*.jpg",
  "docs/_static/_images/*.png",
  "docs/_static/_images/*.rst",
  "docs/Makefile",
  "docs/conf.py",
  "docs/make.bat",
  "src/rook",
  "tests/*.py",
  "tox.ini"
]
exclude = [
  "*.py[co]",
  "__pycache__",
  ".codacy.yml",
  ".dockerignore",
  ".editorconfig",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".readthedocs.yml",
  ".yamllint.yaml",
  "Dockerfile",
  "docker-compose.yml",
  "docs/source/_*",
  "docs/source/apidoc/modules.rst",
  "docs/source/apidoc/rook*.rst"
]

[tool.mypy]
files = "."
# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--cov=rook",
  "--cov-report=term-missing",
  "--ignore=setup.py",
  "--strict-markers",
  "--tb=native"
]
python_files = ["test_*.py"]
markers = [
  "mini_esgf_data: mark test to require the mini-ESGF test data cache",
  "online: mark test to need internet connection",
  "smoke: mark test as a smoke/sanity test"
]
filterwarnings = [
  "ignore:numpy.ndarray size changed, may indicate binary incompatibility.*:RuntimeWarning",
  "ignore:More than one coordinate variable found for type 'time'. Selecting the best fit.*:UserWarning",
  "ignore:Variable time has datetime type and a bounds variable but time.encoding does not have units specified.*:UserWarning",
  "ignore:In a future version of xarray the default value for data_vars will change.*:FutureWarning",
  "ignore:'crs' was not provided.*:UserWarning",
  "ignore:.*polys.*large.*segments.*:UserWarning",
  "ignore:For coordinate variable 'lat' no bounds can be identified.*:UserWarning",
  "ignore:For coordinate variable 'lon' no bounds can be identified.*:UserWarning",
  "ignore:The file '.*/grid_weights/.*' already exists.*:UserWarning"
]

[tool.ruff]
src = ["rook"]
line-length = 150
exclude = [
  ".eggs",
  ".git",
  "build",
  "docs"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
preview = true
ignore = [
  "BLE001", # Do not catch blind exception: `Exception`
  "RUF100", # Unused blanket `noqa` directive
  "B904", # raise exceptions with `raise ... from err`
  "PERF203", # `try`-`except` within a loop incurs performance overhead
  "G004", # Logging statement uses f-string
  "S110", # `try`-`except`-`pass` detected, consider logging the exception
  "S112", # `try`-`except`-`continue` detected, consider logging the exception
  "C408", # Unnecessary `dict()` call (rewrite as a literal)
  "C419", # Unnecessary list comprehension
  "RUF067" # `__init__` module should only contain docstrings and re-exports
]
select = [
  "BLE", # blind-except
  "D", # docstrings
  "E", # pycodestyle errors
  "F", # pyflakes errors
  "RUF", # ruff checks
  "UP", # python version conventions
  "W", # pycodestyle warnings
  "B", # flake8-bugbear
  "N", # naming conventions
  "G", # logging-format
  "C", # complexity
  "PTH", # pathlib
  "FLY", # modernizing string formatting
  "PERF", # iterator performance
  "S" # bandit security
]
extend-select = []

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.isort]
known-first-party = ["rook"]
case-sensitive = true
detect-same-package = false
lines-after-imports = 2
no-lines-before = ["future", "standard-library"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["D100", "PTH100"]
"src/rook/**" = ["D100", "D101", "D102", "D103", "D104"]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "RUF012", "RUF015", "S101"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 180

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.tomlsort]
sort_first = ["build-system", "project"]

[tool.vulture]
exclude = []
ignore_decorators = ["@pytest.fixture"]
ignore_names = [
  "adaptive_masking_threshold",
  "area",
  "level",
  "load_test_data",
  "variable",
  "write_roocs_cfg"
]
min_confidence = 90
paths = ["src/rook", "tests"]
sort_by_size = true
