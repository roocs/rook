name: Build Sphinx docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # For a given workflow, if we push to the same branch, cancel previous runs on that branch except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: Build and verify docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Conda (Micromamba) for docs
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          cache-environment: true
          post-cleanup: none
          environment-file: environment-docs.yml

      - name: Build Sphinx docs
        run: make build-docs

      - name: Upload docs preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sphinx-docs
          path: docs/build/html/
          if-no-files-found: error
          retention-days: 7
