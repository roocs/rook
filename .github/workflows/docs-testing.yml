name: Build docs and slides

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # For a given workflow, if we push to the same branch, cancel previous runs on that branch except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: Build and verify docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DECKTAPE_FLAGS: --chrome-arg=--no-sandbox
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Conda (Micromamba) for docs
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          cache-downloads: true
          cache-environment: true
          post-cleanup: none
          environment-file: environment-docs.yml

      - name: Install PDF toolchain
        run: |
          npm install --global --prefix "$CONDA_PREFIX" decktape@3.16.1
          sh docs/talks/quarto.sh --version
          decktape version

      - name: Check Quarto without Conda activation
        run: python -m unittest discover -s tests/slides -p 'test_quarto.py'

      - name: Check Chromium
        run: |
          node - "$(npm root --global)" <<'JS'
          const {createRequire} = require('node:module');
          const load = createRequire(process.argv[2] + '/decktape/package.json');
          (async () => {
            const browser = await load('puppeteer').launch({
              headless: 'shell', args: ['--no-sandbox']
            });
            console.log(await browser.version());
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Build docs and HTML/PDF talks
        run: |
          make build-docs

      - name: Verify published talks
        run: python docs/talks/check_published.py docs/build/html

      # Read the Docs deploys through its repository integration. This artifact
      # makes the complete, tested site available for review on pushes and PRs.
      - name: Upload docs preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-and-slides
          path: docs/build/html/
          if-no-files-found: error
          retention-days: 7
