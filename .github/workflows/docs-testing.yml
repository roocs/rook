name: Build Sphinx docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # For a given workflow, if we push to the same branch, cancel previous runs on that branch except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: Build and verify docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Conda (Micromamba) for docs
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          cache-downloads: true
          cache-environment: true
          post-cleanup: none
          environment-file: environment-docs.yml

      - name: Build Sphinx docs
        run: make build-docs

      - name: Upload docs preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sphinx-docs
          path: docs/build/html/
          if-no-files-found: error
          retention-days: 7
