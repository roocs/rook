name: Build and deploy slides

on:
  push:
    branches:
      - main
    paths:
      - "docs/talks/**"
      - "tests/slides/**"
      - "mkdocs-slides.yml"
      - ".github/workflows/slides.yml"
  pull_request:
    paths:
      - "docs/talks/**"
      - "tests/slides/**"
      - "mkdocs-slides.yml"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

concurrency:
  # For a given workflow, if we push to the same branch, cancel previous runs on that branch except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  slides-build:
    name: Build and verify slides
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DECKTAPE_FLAGS: --chrome-arg=--no-sandbox
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Conda (Micromamba) for slides
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          cache-environment: true
          post-cleanup: none
          environment-file: docs/talks/environment.yml
          create-args: python=3.11

      - name: Install MkDocs
        run: python -m pip install -r docs/talks/requirements.txt

      - name: Install PDF toolchain
        run: |
          python docs/talks/install_pdf.py
          sh docs/talks/quarto.sh --version
          decktape version

      - name: Check slide toolchain helpers
        run: python -m unittest discover -s tests/slides

      - name: Check Chromium
        run: |
          node - "$(npm root --global)" <<'JS'
          const {createRequire} = require('node:module');
          const load = createRequire(process.argv[2] + '/decktape/package.json');
          (async () => {
            const browser = await load('puppeteer').launch({
              headless: 'shell', args: ['--no-sandbox']
            });
            console.log(await browser.version());
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Build MkDocs site and HTML/PDF slides
        run: make -C docs/talks publish

      - name: Upload slides preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides-site
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  slides-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: slides-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slides-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
