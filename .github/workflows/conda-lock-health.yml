name: conda-lock health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lock-health:
    name: Lock Refresh Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Conda (Micromamba)
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          cache-environment: true
          post-cleanup: none
          environment-name: lockcheck
          create-args: >-
            python=3.12 conda-lock=4.0.0
          channels: conda-forge

      - name: Try lock/spec generation
        run: micromamba run -n lockcheck make conda-lock
